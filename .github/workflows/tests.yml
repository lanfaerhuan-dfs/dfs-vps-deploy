name: Debian tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        debian: [12, 13]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build disposable Debian test image
        run: docker build -f tests/Dockerfile --build-arg DEBIAN=${{ matrix.debian }} -t dfs-debian-tests tests
      - name: Run offline tests and Caddy integration
        run: docker run --rm --network none -v "$PWD:/repo:ro" dfs-debian-tests
      - name: Validate shell entry points
        run: bash -n bootstrap.sh && bash -n scripts/package.sh
